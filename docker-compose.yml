networks:
  red_publica:
    driver: bridge
  red_interna:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgdata_2:
    driver: local
  pg_coord:
    driver: local

services:
  bd-relacional:
    image: postgres:15-alpine
    container_name: bd-relacional
    restart: always
    environment:
      POSTGRES_DB: negocio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./modulo-b/postgres/primary.sh:/primary.sh:ro
      - ./modulo-b/postgres/pg_hba.conf:/replication-pg_hba.conf:ro
      - pg_coord:/coord
    entrypoint: ["/bin/sh", "/primary.sh"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d negocio_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_interna

  bd-relacional-backup:
    image: postgres:15-alpine
    container_name: bd-relacional-backup
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres123
    volumes:
      - pgdata_2:/var/lib/postgresql/data
      - ./modulo-b/postgres/standby.sh:/standby.sh:ro
    entrypoint: ["/bin/sh", "/standby.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d negocio_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - red_interna

  modulo-a:
    build: ./modulo-a
    container_name: modulo-a
    ports:
      - "8080:8080"
    environment:
      - MODULO_B_URL=http://modulo-b:5000
      - MODULO_C_URL=http://modulo-c:6000
    networks:
      - red_publica
      - red_interna

  modulo-b:
    build: ./modulo-b
    container_name: modulo-b
    environment:
      - DB_HOST=bd-relacional
      - DB_BACKUP_HOST=bd-relacional-backup
      - DB_COORD_DIR=/coord
    volumes:
      - pg_coord:/coord
    networks:
      - red_interna

  modulo-c:
    build: ./modulo-c
    container_name: modulo-c
    env_file:
      - ./modulo-c/.env
    networks:
      - red_interna
